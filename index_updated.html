<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ريفايف | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#0b1d3f;--n2:#16305f;--sl:#7f8ca8;--line:#cdd5e4}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:'Readex Pro',Tahoma,sans-serif;color:var(--n);background:radial-gradient(ellipse at 50% 35%,#fff 20%,#e3e8f1 80%);overflow-x:hidden}
.b{position:fixed;z-index:0;background:rgba(112,128,160,.26);filter:blur(26px);border-radius:60% 40% 55% 45%;animation:m 20s ease-in-out infinite alternate;pointer-events:none}
@keyframes m{to{border-radius:42% 58% 40% 60%;transform:translate(70px,-50px) rotate(28deg) scale(1.18)}}
.wv{position:fixed;bottom:0;left:0;width:200%;height:90px;z-index:0;pointer-events:none;animation:w 16s linear infinite}
.wv path{fill:rgba(11,29,63,.07)}
.wv.s{animation-duration:26s;animation-direction:reverse;height:70px}
@keyframes w{to{transform:translateX(-50%)}}
#login{position:relative;z-index:1;min-height:100vh}
.land{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:26px 16px 100px}
.cta{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw)}
.cta .pri{text-align:center}
.pri.sec{background:rgba(255,255,255,.72);color:var(--n);border:1.5px solid var(--n2);box-shadow:none}
.lg{position:fixed;top:16px;left:16px;z-index:5;padding:9px 18px;border-radius:30px;background:rgba(255,255,255,.75);color:var(--n);text-decoration:none;font-weight:600;border:1px solid var(--line);backdrop-filter:blur(8px)}
.about{position:relative;overflow:hidden;width:min(780px,100%);margin-top:26px;padding:36px clamp(20px,4vw,46px);border-radius:32px 32px 32px 10px;background:linear-gradient(160deg,#0b1d3f,#16305f,#21478a,#0b1d3f);background-size:300% 300%;animation:sh 16s ease infinite;box-shadow:0 22px 60px rgba(11,29,63,.35)}
.about h2{margin:0 0 20px;font-size:clamp(36px,8vw,56px);font-weight:700;background:linear-gradient(90deg,#fff,#9fb4e3,#fff,#9fb4e3);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.about p{margin:0 0 16px;line-height:2.05;font-size:16.5px;text-align:start;color:#d3def4;position:relative;z-index:1}
@keyframes shim{to{background-position:-200% 0}}
.sp{position:absolute;z-index:2;pointer-events:none;border-radius:50%;background:#fff;box-shadow:0 0 9px 2px rgba(255,255,255,.85);opacity:0;animation:tw var(--d) ease-in-out var(--l) infinite}
.sp.st{border-radius:0;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes tw{0%{opacity:0;transform:translateY(8px) scale(.3)}40%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.25)}}
.land img{width:min(400px,82vw);mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 71%);mask-image:radial-gradient(circle,#000 52%,transparent 71%);animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-12px)}}
.pri{display:inline-block;border:0;cursor:pointer;text-decoration:none;font:600 15px inherit;font-family:inherit;color:#fff;padding:13px 34px;border-radius:14px;background:linear-gradient(135deg,var(--n2),var(--n));box-shadow:0 8px 24px rgba(11,29,63,.28);transition:.25s}
.pri:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(11,29,63,.36)}
.pri:disabled{opacity:.5}
#app{position:relative;z-index:1;display:flex;min-height:100vh}
aside{width:272px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;color:#dfe6f4;background:linear-gradient(160deg,#0b1d3f,#16305f,#21478a,#0b1d3f);background-size:300% 300%;animation:sh 16s ease infinite;box-shadow:-10px 0 40px rgba(11,29,63,.18)}
@keyframes sh{50%{background-position:100% 100%}}
#mb{display:none;position:fixed;z-index:30;top:12px;right:12px;width:44px;height:44px;border:0;border-radius:14px;background:var(--n);color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(11,29,63,.3)}
#ov{display:none}
.brand{font-size:30px;font-weight:700;padding:4px 10px 2px}
.brand small{display:block;font-size:12px;font-weight:300;color:#9fb0cf}
#g{margin:16px 0 12px;width:100%;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:#fff;font:inherit}
#g option{color:var(--n)}
nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
nav a{display:flex;gap:11px;align-items:center;padding:11px 14px;border-radius:12px;cursor:pointer;color:#c3cfe6;transition:.2s;border-inline-start:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a.on{background:rgba(255,255,255,.15);color:#fff;border-inline-start-color:#fff;font-weight:600}
.out{color:#9fb0cf;font-size:13px;padding:10px 14px;text-decoration:none}
main{flex:1;padding:34px clamp(16px,4vw,56px) 120px;max-width:980px}
h1{font-size:28px;margin:0 0 22px;font-weight:700}
.card{background:rgba(255,255,255,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:26px 26px 26px 8px;padding:26px;box-shadow:0 14px 44px rgba(11,29,63,.09);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 20px;margin-bottom:22px}
.f.w{grid-column:1/-1}
.f>label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--n2)}
input:not([type=checkbox]),select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.85);font:inherit;color:var(--n);transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--n2);box-shadow:0 0 0 4px rgba(22,48,95,.12)}
input.q{margin-bottom:8px}
.sw input{display:none}
.sw i{display:block;width:50px;height:28px;border-radius:20px;background:#c3cbdb;position:relative;cursor:pointer;transition:.3s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.3s}
.sw input:checked+i{background:var(--n2)}
.sw input:checked+i::after{transform:translateX(-22px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--n);font:inherit;padding:8px 18px;border-radius:30px;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--n);color:#fff;border-color:var(--n)}
.ar-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;background:rgba(255,255,255,.55)}

/* ===== اختصارات الأوامر - أوامر رئيسية وبداخل كل أمر عدة اختصارات ===== */
.shortcut-panel{grid-column:1/-1;background:linear-gradient(180deg,#070b18,#0b1020);border:1px solid rgba(255,255,255,.08);border-radius:30px;padding:22px;box-shadow:0 22px 55px rgba(4,9,24,.25);color:#fff}
.shortcut-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.shortcut-head h3{margin:0;font-size:20px}.shortcut-head small{display:block;margin-top:5px;color:#8995ad;font-size:12px}
.shortcut-list{display:grid;gap:14px}
.shortcut-command{border:1px solid rgba(255,255,255,.09);border-radius:25px;background:linear-gradient(135deg,rgba(17,22,39,.98),rgba(8,12,25,.98));overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.16);cursor:pointer}
.shortcut-command-head{display:flex;align-items:center;gap:14px;padding:17px 20px}
.shortcut-command-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(69,52,154,.22);border:1px solid rgba(111,98,220,.2);font-size:24px;flex:none}
.shortcut-command-info{min-width:0;flex:1;text-align:right}.shortcut-command-name{font-size:19px;font-weight:700;color:#f3f5fa;direction:ltr;text-align:right}.shortcut-command-desc{margin-top:4px;color:#8995ad;font-size:12px}
.shortcut-command-add{border:0;border-radius:13px;padding:10px 14px;background:rgba(102,123,208,.16);color:#b9c6ff;font:inherit;cursor:pointer;white-space:nowrap}.shortcut-command-add:hover{background:rgba(102,123,208,.27)}
.shortcut-aliases{padding:0 14px 14px;display:block}.shortcut-empty{padding:12px 14px;color:#66728a;font-size:12px;text-align:right;border:1px dashed rgba(255,255,255,.12);border-radius:14px}
.shortcut-aliases-preview{min-height:48px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:8px 10px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(43,48,91,.38)}
.shortcut-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:9px;background:rgba(20,25,42,.9);color:#eef1f8;font-size:14px}.shortcut-chip b{font-weight:400;color:#fff}
.shortcut-edit{width:42px;height:42px;border:0;border-radius:13px;background:rgba(63,45,145,.25);color:#9caeff;font-size:20px;cursor:pointer}.shortcut-edit:hover{background:rgba(87,69,183,.4)}
.shortcut-toggle{position:relative;width:64px;height:34px;flex:none}.shortcut-toggle input{display:none}.shortcut-toggle i{display:block;width:64px;height:34px;border-radius:999px;background:#4f5f86;cursor:pointer;transition:.2s}.shortcut-toggle i:after{content:'✓';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#64708a;font-style:normal;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:.2s}.shortcut-toggle input:checked+i{background:#667bd0}.shortcut-toggle input:checked+i:after{transform:translateX(30px);color:#667bd0}
.shortcut-alias-editor{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:58px;padding:8px 10px;background:rgba(43,48,91,.8);border:1px solid rgba(255,255,255,.12);border-radius:9px}
.shortcut-alias-editor input{flex:1;min-width:150px;border:0!important;background:transparent!important;box-shadow:none!important;padding:8px 4px!important}
.shortcut-chip button{border:0;background:transparent;color:#aeb8ca;font-size:18px;line-height:1;cursor:pointer;padding:0}
.shortcut-add{width:100%;margin-top:16px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.18);color:#dce2ef;box-shadow:none}.shortcut-add:hover{background:rgba(255,255,255,.1);transform:none}
.sc-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,16,.72);backdrop-filter:blur(8px)}.sc-modal.open{display:flex}.sc-modal-box{width:min(560px,100%);max-height:90vh;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:linear-gradient(180deg,#263247,#1b2639 45%,#162135);box-shadow:0 30px 90px rgba(0,0,0,.48);color:#fff}.sc-modal-head{padding:24px 28px 18px;border-bottom:1px solid rgba(255,255,255,.1)}.sc-modal-head h3{margin:0;font-size:26px}.sc-modal-head p{margin:7px 0 0;color:#aeb8ca}.sc-modal-body{padding:24px 28px;display:grid;gap:18px}.sc-modal-body label{display:block;margin-bottom:7px;color:#e4e8ef;font-size:14px}.sc-modal-body input{background:rgba(43,48,91,.8)!important;color:#fff!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:9px!important}.sc-modal-actions{display:flex;gap:12px;padding:18px 28px;border-top:1px solid rgba(255,255,255,.1)}.sc-modal-actions .pri{min-width:110px}.sc-cancel{border:0;border-radius:14px;padding:12px 25px;background:#314057;color:#94a1b8;font:inherit;cursor:pointer}.sc-danger{margin-inline-start:auto;border:0;border-radius:14px;padding:12px 18px;background:rgba(177,55,72,.18);color:#ff9eaa;font:inherit;cursor:pointer}
@media(max-width:640px){.shortcut-panel{padding:14px;border-radius:24px}.shortcut-command-head{padding:14px;gap:10px}.shortcut-command-icon{width:44px;height:44px;border-radius:13px;font-size:20px}.shortcut-command-name{font-size:16px}.shortcut-command-desc{font-size:10px}.shortcut-command-add{padding:8px 10px;font-size:12px}.shortcut-aliases{padding:9px}.shortcut-alias{grid-template-columns:minmax(0,1fr) 54px 40px;padding:9px}.shortcut-alias-name{font-size:14px}.shortcut-toggle{width:54px}.shortcut-toggle i{width:54px;height:30px}.shortcut-toggle i:after{width:22px;height:22px;top:4px;left:4px}.shortcut-toggle input:checked+i:after{transform:translateX(24px)}.shortcut-edit{width:40px;height:40px}.shortcut-aliases-preview{min-height:44px}.shortcut-chip{font-size:13px;padding:6px 8px}.shortcut-alias-editor input{min-width:110px}.sc-modal-box{border-radius:24px}.sc-modal-head,.sc-modal-body,.sc-modal-actions{padding-inline:18px}.sc-modal-actions{flex-wrap:wrap}.sc-danger{margin-inline-start:0}}
.ar-row .r{grid-column:1/-1}.mn{display:flex;align-items:center;gap:10px}
.del{border:0;border-radius:12px;background:#f3dde1;color:#a12b3a;font:inherit;cursor:pointer;padding:9px}
.sm{padding:10px 22px;font-size:14px;margin-top:4px}
#t{position:fixed;z-index:9999;top:18px;left:18px;right:auto;bottom:auto;transform:translateX(calc(-100% - 30px));width:min(390px,calc(100vw - 36px));min-height:66px;padding:14px 16px;border-radius:16px;color:#fff;font-weight:600;transition:transform .32s ease,opacity .32s ease;opacity:0;box-shadow:0 14px 38px rgba(0,0,0,.24);display:flex;align-items:center;gap:12px;direction:rtl;border:1px solid rgba(255,255,255,.18);pointer-events:none}
#t.show{transform:translateX(0);opacity:1}
#t.ok{background:linear-gradient(135deg,#153b65,#0b1d3f)}#t.er{background:linear-gradient(135deg,#a12b3a,#721c2a)}
#t .toast-icon{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.16);font-size:21px}
#t .toast-message{line-height:1.65;font-size:13px;overflow-wrap:anywhere}
@media(max-width:480px){#t{top:12px;left:12px;width:calc(100vw - 24px)}}
#main.sec .ph{display:flex;align-items:center;gap:16px;padding:22px 26px;margin-bottom:22px;border-radius:26px 26px 26px 8px;color:#fff;background:linear-gradient(160deg,#0b1d3f,#16305f 55%,#21478a);box-shadow:0 16px 40px rgba(11,29,63,.28);position:relative;overflow:hidden}

#main.sec .ph .pi{flex:none;width:58px;height:58px;display:grid;place-items:center;font-size:28px;border-radius:18px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#main.sec .ph h1{margin:0;font-size:26px;color:#fff}
#main.sec .ph small{display:block;margin-top:4px;color:#b9c8e8;font-size:13px}
#main.sec .card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid #dde4f0;border-top:5px solid var(--n);box-shadow:0 12px 34px rgba(11,29,63,.1)}
#main.sec .f>label{display:flex;align-items:center;gap:8px;color:var(--n);font-weight:700}
#main.sec .f>label::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--n2)}
#main.sec input:not([type=checkbox]),#main.sec select,#main.sec textarea{background:#f4f7fc;border:1.5px solid #d3dbea}

#main.sec #sv{position:sticky;bottom:18px;display:block;width:100%;padding:16px;font-size:16px;z-index:5}
#main.sec code{background:var(--n);color:#fff;padding:2px 9px;border-radius:8px;font-family:monospace}
#main.sec .lgtop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;border-radius:16px;background:var(--n);margin-bottom:16px}

.profile-wrap{display:flex;justify-content:center;margin:10px 0 2px}
.profile-card{position:relative;width:min(430px,100%);padding:26px 28px 24px;border-radius:30px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 55px rgba(11,29,63,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;overflow:hidden}
.profile-card:before{content:"";position:absolute;inset:-80px 15% auto;height:190px;background:radial-gradient(circle,rgba(82,116,177,.18),transparent 68%);pointer-events:none}
.profile-avatar{position:relative;width:112px;height:112px;margin:0 auto 14px;border-radius:50%;object-fit:cover;display:block;border:5px solid rgba(255,255,255,.96);box-shadow:0 12px 34px rgba(11,29,63,.2)}
.profile-name{position:relative;margin:0;color:var(--n);font-size:21px;font-weight:700;direction:ltr;word-break:break-word}
.profile-tag{position:relative;margin:7px 0 0;color:#71809a;font-size:13px;direction:ltr;word-break:break-word}
.profile-badge{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 12px;border-radius:999px;background:#f2f5fa;border:1px solid #e0e6f0;color:#52627d;font-size:12px;font-weight:600}

/* ===== واجهة ريفايف الجديدة ===== */
#login,.home-shell{position:relative;overflow:hidden}
.discord-floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.discord-floaters img{position:absolute;width:30px;height:30px;opacity:.13;filter:drop-shadow(0 0 10px rgba(88,101,242,.28));animation:discordFloat var(--fd,18s) ease-in-out infinite alternate;animation-delay:var(--fl,0s)}
@keyframes discordFloat{
  0%{transform:translate3d(0,0,0) rotate(0deg) scale(.8)}
  25%{transform:translate3d(var(--x1),var(--y1),0) rotate(65deg) scale(1)}
  50%{transform:translate3d(var(--x2),var(--y2),0) rotate(150deg) scale(.9)}
  75%{transform:translate3d(var(--x3),var(--y3),0) rotate(240deg) scale(1.08)}
  100%{transform:translate3d(var(--x4),var(--y4),0) rotate(360deg) scale(.82)}
}
.home-top-actions{position:fixed;top:18px;right:22px;z-index:8;display:flex;gap:10px;align-items:center}
.home-top-actions .pri{padding:11px 19px;border-radius:13px;font-size:13px;backdrop-filter:blur(10px)}
.home-top-actions .sec{background:rgba(255,255,255,.86);border:1px solid rgba(11,29,63,.18);color:var(--n)}
.home-dashboard{position:relative;z-index:3;margin-top:8px;padding:13px 28px;border-radius:17px;font-size:16px;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 14px 40px rgba(11,29,63,.25)}
.home-dashboard:before,.home-top-actions .pri:before,.pri:before{
  content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;
  background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.95) 38%,transparent 58%,rgba(255,255,255,.45) 78%,transparent 92%);
  background-size:220% 100%;animation:borderSweep 2.8s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none
}
@keyframes borderSweep{to{background-position:-220% 0}}
.pri{position:relative;overflow:hidden}
.pri:after{content:"";position:absolute;top:-120%;left:-45%;width:28%;height:340%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:buttonShine 3.2s ease-in-out infinite;pointer-events:none}
.pri.sec:after{background:linear-gradient(90deg,transparent,rgba(11,29,63,.35),transparent)}
@keyframes buttonShine{0%,55%{left:-45%}100%{left:135%}}
.home-main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 16px 110px}
.home-main .home-logo{width:180px;height:180px;object-fit:cover;border-radius:50%;mix-blend-mode:normal;background:#fff;padding:8px;border:4px solid rgba(255,255,255,.95);animation:fl 7s ease-in-out infinite alternate;filter:drop-shadow(0 18px 34px rgba(11,29,63,.18));box-shadow:0 0 0 7px rgba(11,29,63,.06),0 18px 40px rgba(11,29,63,.18)}
.creator-card{position:relative;z-index:3;width:min(760px,calc(100vw - 32px));margin:10px auto 26px;padding:20px 24px;border-radius:24px;background:linear-gradient(145deg,rgba(4,12,28,.97),rgba(11,29,63,.96),rgba(22,48,95,.95));border:1px solid rgba(255,255,255,.13);box-shadow:0 20px 55px rgba(3,10,25,.28);color:#fff;overflow:hidden}
.creator-card:before{content:"";position:absolute;inset:-80px auto auto -40px;width:240px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);animation:creatorGlow 5s ease-in-out infinite alternate}
@keyframes creatorGlow{to{transform:translate(430px,45px) scale(1.35);opacity:.5}}
.creator-inner{position:relative;display:flex;align-items:center;justify-content:center;gap:17px}
.creator-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 0 0 5px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.25)}
.creator-info{text-align:right}
.creator-kicker{font-size:11px;color:#aebddd;margin-bottom:5px}
.creator-name{margin:0;font-size:19px}
.creator-tag{font-size:12px;color:#9aaacc;margin-top:4px;direction:ltr;text-align:right}
.creator-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.creator-meta span{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:11px;color:#dfe6f4}
.about{z-index:3}
.about:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.1);background:linear-gradient(120deg,transparent,rgba(255,255,255,.09),transparent);background-size:220% 100%;animation:aboutSweep 5s linear infinite;pointer-events:none}
@keyframes aboutSweep{to{background-position:-220% 0}}
/* تأثيرات خيارات وأزرار الداشبورد */
#main .card,#main .tabs,#main .ar-row,#main .sec-row,#main .lg-row,#main .pk,#main .lang-pick button,#main .stat-box,#main .ph{
  position:relative;overflow:hidden
}
#main .card:before,#main .ar-row:before,#main .sec-row:before,#main .lg-row:before,#main .pk:before,#main .lang-pick button:before,#main .stat-box:before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.72) 47%,transparent 68%);
  background-size:240% 100%;animation:creamEdge 5.5s linear infinite;opacity:.42
}
@keyframes creamEdge{to{background-position:-240% 0}}
/* شرارات بيضاء متحركة حول خيارات الأوامر */
.cmd-spark{position:absolute!important;width:4px!important;height:4px!important;padding:0!important;border:0!important;border-radius:50%!important;background:#fff!important;box-shadow:0 0 6px 2px rgba(255,255,255,.95),0 0 13px 3px rgba(255,255,255,.5);pointer-events:none!important;z-index:20;animation:sparkOut var(--sd,1.8s) ease-out var(--sl,0s) infinite;opacity:0}
@keyframes sparkOut{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}
.cmd-spark-host{position:relative!important;overflow:hidden!important}
.creator-only{gap:14px}
.creator-discord-avatar{padding:14px;background:#5865F2;object-fit:contain;border-color:rgba(255,255,255,.95);box-shadow:0 0 0 5px rgba(88,101,242,.18),0 10px 28px rgba(0,0,0,.28)}
.creator-only .creator-name{font-size:21px;letter-spacing:.3px}
#main .tabs button,#main .pk,#main .lang-pick button,.sm{
  transition:transform .25s,box-shadow .25s,border-color .25s
}
#main .tabs button:hover,#main .pk:hover,#main .lang-pick button:hover,.sm:hover{
  transform:translateY(-2px);box-shadow:0 8px 22px rgba(11,29,63,.14)
}
#main.sec .tabs button.on,.pk.on{
  box-shadow:0 0 0 1px rgba(255,255,255,.7),0 8px 25px rgba(11,29,63,.22)
}
#main.sec .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,255,255,.12),transparent);background-size:220% 100%;animation:creamEdge 4.5s linear infinite;pointer-events:none}
@media(max-width:640px){
 .home-top-actions{top:12px;right:12px;left:12px;justify-content:flex-end}
 .home-top-actions .pri{padding:9px 12px;font-size:11px}
 .home-main{padding-top:88px}
 .creator-inner{flex-direction:column;text-align:center}
 .creator-info{text-align:center}.creator-tag{text-align:center}
 .creator-meta{justify-content:center}
 .discord-floaters img{width:24px;height:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sp{opacity:.7}}

@media(max-width:640px){.discord-floaters img{animation-duration:28s;opacity:.09}.b{filter:blur(18px);opacity:.65}#main .card{box-shadow:0 8px 24px rgba(11,29,63,.07)}}

/* ===== الصفحة الرئيسية الجديدة (مثل موقع refife-bot.oriaxen.com) ===== */
.l-wrap{position:relative;z-index:2;width:100%}
.l-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px clamp(14px,4vw,44px);background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(11,29,63,.08)}
.l-brand{display:flex;align-items:center;gap:10px;color:var(--n);text-decoration:none;font-weight:700;font-size:22px}
.l-brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 4px 14px rgba(11,29,63,.18)}
.l-links{display:flex;flex-direction:row;overflow:visible;gap:6px;margin-inline-start:12px;flex:1}
.l-links a{border-inline-start:0}
.l-links a{padding:9px 14px;border-radius:11px;color:var(--n2);text-decoration:none;font-size:14px;font-weight:600;transition:.2s}
.l-links a:hover{background:rgba(11,29,63,.07)}
.l-actions{display:flex;gap:10px;align-items:center}
.l-lang{border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--n);font:600 13px inherit;font-family:inherit;padding:9px 15px;border-radius:11px;cursor:pointer}
.l-lang:hover{background:#fff}
.l-actions .pri{padding:10px 22px;font-size:14px;border-radius:12px}
.l-menu{display:none;border:0;background:var(--n);color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.l-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:clamp(46px,9vw,96px) 16px 34px}
.l-badge{padding:7px 16px;border-radius:99px;background:rgba(11,29,63,.07);border:1px solid rgba(11,29,63,.1);font-size:13px;font-weight:600;color:var(--n2)}
.l-hero h2{margin:0;max-width:820px;font-size:clamp(32px,6.4vw,64px);line-height:1.25;font-weight:700;background:linear-gradient(120deg,#0b1d3f,#21478a,#0b1d3f);-webkit-background-clip:text;background-clip:text;color:transparent}
.l-hero p{margin:0;max-width:640px;font-size:clamp(15px,2.2vw,18px);line-height:2;color:#3d4d6e}
.l-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.l-btns .pri{padding:14px 32px;font-size:16px;border-radius:15px}
.l-ticker{overflow:hidden;margin:26px 0 10px;padding:14px 0;background:linear-gradient(90deg,#0b1d3f,#16305f,#21478a,#16305f,#0b1d3f);color:#dfe6f4;direction:ltr;box-shadow:0 10px 30px rgba(11,29,63,.2)}
.l-ticker-in{display:flex;gap:42px;width:max-content;animation:tick 28s linear infinite;font-weight:600;font-size:15px;white-space:nowrap}
.l-ticker-in span:after{content:"✦";margin-inline-start:42px;color:#9fb4e3}
@keyframes tick{to{transform:translateX(-50%)}}
.l-sec{max-width:1080px;margin:0 auto;padding:clamp(40px,7vw,70px) clamp(16px,4vw,32px) 10px}
.l-sec-h{text-align:center;margin-bottom:30px}
.l-sec-h h2{margin:0 0 8px;font-size:clamp(26px,4.4vw,38px);font-weight:700}
.l-sec-h p{margin:0;color:#5b6b88;font-size:15px}
.l-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.l-stat{position:relative;overflow:hidden;text-align:center;padding:28px 16px;border-radius:26px 26px 26px 8px;color:#fff;background:linear-gradient(160deg,#0b1d3f,#16305f 55%,#21478a);box-shadow:0 16px 40px rgba(11,29,63,.24)}
.l-stat b{display:block;font-size:clamp(34px,5vw,46px);font-weight:700;line-height:1.2}
.l-stat span{display:block;margin-top:6px;color:#b9c8e8;font-size:14px}
.l-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.l-feat{padding:26px;border-radius:26px 26px 26px 8px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 44px rgba(11,29,63,.09);transition:.3s}
.l-feat:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(11,29,63,.16)}
.l-feat i{display:grid;place-items:center;width:54px;height:54px;margin-bottom:16px;border-radius:17px;font-style:normal;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--n2),var(--n));box-shadow:0 8px 20px rgba(11,29,63,.25)}
.l-feat h3{margin:0 0 8px;font-size:19px}
.l-feat p{margin:0;color:#4a5a7a;line-height:1.9;font-size:14.5px}
.l-team{display:flex;justify-content:center}
.l-team .creator-card{margin:0}
.l-cta{position:relative;overflow:hidden;max-width:880px;margin:46px auto 0;padding:clamp(34px,6vw,56px) 24px;text-align:center;border-radius:32px 32px 32px 10px;background:linear-gradient(160deg,#0b1d3f,#16305f,#21478a,#0b1d3f);background-size:300% 300%;animation:sh 16s ease infinite;box-shadow:0 22px 60px rgba(11,29,63,.35);width:calc(100% - 32px)}
.l-cta h2{margin:0 0 10px;font-size:clamp(28px,5vw,42px);color:#fff}
.l-cta p{margin:0 0 22px;color:#d3def4;line-height:2;position:relative;z-index:1}
.l-cta .pri{background:#fff;color:var(--n);position:relative;z-index:1;padding:14px 38px;font-size:16px}
.l-foot{margin-top:46px;padding:26px 16px 120px;text-align:center;color:#5b6b88;font-size:13px}
.l-foot b{display:block;margin-bottom:4px;color:var(--n);font-size:18px}
[dir=ltr] .l-brand,[dir=ltr] .l-links{direction:ltr}
@media(max-width:820px){
  .l-links{position:absolute;top:100%;inset-inline:0;flex-direction:column !important;padding:10px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:none;margin:0}
  .l-head.open .l-links{display:flex}
  .l-menu{display:block;margin-inline-start:auto}
  .l-actions{margin-inline-start:0}
  .l-actions .pri{display:none}
  .l-head{gap:10px}
}
#main .l-wrap{margin:-34px calc(-1 * clamp(16px,4vw,56px)) 0;width:auto}

/* ===== واجهة مستوحاة من Refife Bot: كحلي عميق وبطاقات زرقاء ===== */
:root{--n:#08132c;--n2:#203f83;--sl:#9aafd8;--line:#2b3e69}
html,body{background:#071126!important;color:#edf3ff!important}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 52% 40%,rgba(38,74,143,.48),transparent 55%),linear-gradient(145deg,#071126 0%,#102653 48%,#071126 100%)}
.b{background:rgba(49,87,157,.12)!important;filter:blur(32px)!important;animation:none!important}
.wv path{fill:rgba(65,103,181,.11)!important}
#app{z-index:2;gap:0}
aside{width:290px;padding:24px 18px 18px;background:linear-gradient(180deg,rgba(28,55,112,.98),rgba(10,22,51,.99))!important;animation:none!important;box-shadow:none;border-inline-start:1px solid rgba(130,159,221,.13)}
.brand{font-size:29px;color:#f4f7ff;padding:6px 8px}.brand small{font-size:13px;color:#a8b9dc;margin-top:3px}
#g{margin:14px 0 12px;border-radius:13px;border:1px solid rgba(174,194,235,.26);background:rgba(255,255,255,.07);color:#eef3ff}
nav{gap:4px;scrollbar-width:thin;scrollbar-color:#53658b transparent}
nav .ng{padding:16px 12px 5px;color:#91a7d2;font-size:12px;font-weight:700}
nav a{padding:12px 13px;border-radius:12px;color:#c8d4ee;border:0!important;transition:background .15s,color .15s}
nav a span{width:26px;min-width:26px;text-align:center;font-size:18px;filter:none}
nav a:hover{background:rgba(255,255,255,.07);color:white}
nav a.on{background:rgba(145,169,222,.29);color:#fff;font-weight:700;border-inline-start:0!important}
.out{margin-top:10px;border-top:1px solid rgba(178,197,237,.2);padding:15px 12px;color:#c5d2ed;font-size:14px}
#mb{background:#172b5b;color:white;box-shadow:none;border:1px solid rgba(255,255,255,.06)}
main{max-width:none;padding:32px clamp(16px,3vw,38px) 100px;color:#edf3ff}
h1,h2,h3,b,strong{color:#f0f4ff}
#main .ph{border-radius:23px 23px 23px 8px;background:linear-gradient(115deg,#1d3b7c,#284c9b);border:1px solid rgba(130,161,226,.16);color:#fff;box-shadow:none}
#main .ph h1,#main .ph small{color:#fff}
#main .card,#main .lang-stat-card,#main .stat-box,#main .ar-row,#main .sec-row,#main .lg-row,#main .shortcut-panel{background:rgba(12,23,49,.83)!important;color:#edf3ff!important;border:1px solid #273b66!important;border-radius:22px!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#main .card{padding:22px}
#main label,#main .f>label,#main .nt,#main .stat-sub{color:#aebfe1!important}
#main input:not([type=checkbox]),#main select,#main textarea,#main .q{background:#17264a!important;color:#edf3ff!important;border:1px solid #344a78!important;border-radius:12px!important;box-shadow:none!important}
#main input::placeholder,#main textarea::placeholder{color:#93a5ca!important}
#main input:focus,#main select:focus,#main textarea:focus{border-color:#648ce4!important;box-shadow:0 0 0 2px rgba(74,119,220,.15)!important}
#main .pri,#main button.pri{background:#23458e!important;color:#fff!important;border:1px solid rgba(154,180,241,.16)!important;box-shadow:none!important}
#main .tabs button,#main .lang-pick button,#main .pk,#main .sm{background:#15264b!important;color:#dce7ff!important;border:1px solid #2a3f6d!important;box-shadow:none!important}
#main .tabs button.on,#main .lang-pick button.on,#main .pk.on{background:#3158a6!important;border-color:#668be0!important;color:white!important}
#main .sw i{background:#344568!important}#main .sw input:checked+i{background:#3158a6!important}
#main .shortcut-panel{background:#0b1530!important}#main .shortcut-command{background:#101e3e!important;border-color:#2a3e69!important;box-shadow:none!important}

  if('IntersectionObserver' in window){
    const typeObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      const el=entry.target;
      if(el.dataset.typed==='1'){typeObserver.unobserve(el);return;}
      el.dataset.typed='1';
      const original=el.textContent||'';
      const chars=Array.from(original);
      el.textContent='';el.classList.add('typewriter-cursor');
      let idx=0;
      const typeNext=()=>{
        if(idx<chars.length){el.textContent+=chars[idx++];setTimeout(typeNext,lang==='en'?22:38)}
        else{el.classList.remove('typewriter-cursor');typeObserver.unobserve(el)}
      };
      typeNext();
    }),{threshold:.25});
    typeTargets.forEach(el=>{el.dataset.typed='0';typeObserver.observe(el)});
  }
}

async function pick(s,sl){
  if(s!=lastS){tmode='setup';lastS=s}
  $('#main').classList.toggle('sec',s!='home');
  if(s=='home'){cur=s;$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.s==s));drawHome();return}
  cur=s;const c=F[s];slot=sl||(c.s?c.s[0][0]:'');
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.s==s));
  if(c.custom=='language')return drawLanguage();
  if(c.custom=='points')return drawPoints(s);
  if(c.custom=='stats')return drawStats();
  if(c.custom=='rate')return drawRate();
  if(c.custom=='reviews')return drawReviews();
  if(c.custom=='errorcodes')return drawErrorCodes();
  if(c.modes&&tmode=='panel')return drawTP();
  try{data=await api(`/api/guilds/${gid}/settings/${s}?slot=${slot}`)}catch(e){return toast(e.message,0)}
  draw();
}

async function drawPoints(section){

  <div class="f"><label>عنوان البانل</label><input id="pt-title" maxlength="256" value="${esc(cfg.title||'نظام النقاط')}" placeholder="عنوان الإيمبد"></div>
  <div class="f w"><label>وصف البانل</label><textarea id="pt-desc" rows="4" maxlength="4000" placeholder="اكتب وصف البانل">${esc(cfg.description||'اختر من القائمة لإدارة النقاط')}</textarea></div>
  <div class="f"><label>لون البانل</label><select id="pt-color">${colorOptions}</select></div>
  <div class="f"><label>روم إرسال البانل</label><select id="pt-channel"><option value="">— اختر الروم —</option>${channelOptions}</select></div>
  <div class="f w"><label>رابط صورة البانل (اختياري)</label><input id="pt-image" type="url" value="${esc(cfg.image_url||'')}" placeholder="https://..."></div>
  <div class="f"><label>إظهار صورة السيرفر</label><select id="pt-icon"><option value="false" ${String(cfg.show_server_icon||'false')!=='true'?'selected':''}>لا</option><option value="true" ${String(cfg.show_server_icon||'false')==='true'?'selected':''}>نعم</option></select></div>

    catch(e){toast(e.message,0)}finally{btn.disabled=false}
  };
}

  if($('#bwadd')){const add=()=>{const i=$('#bwin'),w=i.value.trim().toLowerCase();if(!w)return;if(w.length<2)return toast('الكلمة لازم تكون حرفين على الأقل',0);if(!$$('#form .cw').some(x=>x.dataset.w==w))$('#form .bw').insertAdjacentHTML('beforeend',bwChip(w));i.value=''};$('#bwadd').onclick=add;$('#bwin').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();add()}};$('#form').onclick=e=>{const x=e.target.closest('.bwx');if(x)x.closest('.cw').remove()}}
  if($('#scmodal')){
    let editingTarget='';
    const modal=$('#scmodal'),command=$('#sccommand'),aliases=$('#scaliases'),input=$('#scaliasinput'),enabled=$('#scenabled');
    const close=()=>{modal.classList.remove('open');editingTarget=''};
    const currentRows=target=>$$(`.shortcut-command[data-target="${CSS.escape(target)}"] .shortcut-alias`);
    const open=(target)=>{
      editingTarget=target;
      const group=$(`.shortcut-command[data-target="${CSS.escape(target)}"]`);

      const metaCmd=SC_COMMANDS.find(x=>x[0]===target);
      $('#scmdesc').textContent=`${metaCmd?metaCmd[2]:'الأمر'} — أضف أكثر من اختصار داخل هذا الأمر.`;
      enabled.checked=true;
      aliases.querySelectorAll('.sc-edit-chip').forEach(x=>x.remove());

        const wrap=document.createElement('span');

        wrap.dataset.name=ch.dataset.name||ch.textContent.trim();
        wrap.innerHTML=`<b>${esc(wrap.dataset.name)}</b><button type="button" title="حذف">×</button>`;
        aliases.insertBefore(wrap,input);
      });
      input.value='';
      modal.classList.add('open'); input.focus();
    };
    const addChip=()=>{
      const n=input.value.trim();
      if(!n)return;
      if(/\s/.test(n))return toast('الاختصار لازم يكون كلمة وحدة',0);
      const duplicate=[...aliases.querySelectorAll('.sc-edit-chip')].some(x=>x.dataset.name.toLowerCase()===n.toLowerCase());
      if(duplicate)return toast('هذا الاختصار مضاف بالفعل',0);
      const wrap=document.createElement('span');
      wrap.className='shortcut-chip sc-edit-chip';wrap.dataset.name=n;
      wrap.innerHTML=`<b>${esc(n)}</b><button type="button" title="حذف">×</button>`;
      aliases.insertBefore(wrap,input);input.value='';input.focus();
    };
    input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addChip()}};
    aliases.onclick=e=>{const b=e.target.closest('.sc-edit-chip button');if(b)b.parentElement.remove()};
    $$('.shortcut-command-add').forEach(b=>b.onclick=e=>{e.stopPropagation();open(b.dataset.addTarget)});
    $$('.shortcut-command').forEach(c=>c.onclick=e=>{if(!e.target.closest('.shortcut-command-add'))open(c.dataset.target)});
    $('#scapply').onclick=()=>{
      if(!editingTarget)return;
      const group=$(`.shortcut-command[data-target="${CSS.escape(editingTarget)}"]`);
      const names=[...aliases.querySelectorAll('.sc-edit-chip')].map(x=>x.dataset.name.trim()).filter(Boolean);
      const folded=new Set();
      for(const n of names){const key=n.toLowerCase();if(folded.has(key))return toast('لا يمكن تكرار الاختصار داخل الأمر نفسه',0);folded.add(key)}
      const conflicts=$$('.shortcut-command').filter(g=>g!==group).flatMap(g=>[...g.querySelectorAll('.shortcut-chip')].map(ch=>(ch.dataset.name||ch.textContent).trim().toLowerCase()));
      const conflict=names.find(n=>conflicts.includes(n.toLowerCase()));
      if(conflict)return toast(`الاختصار «${conflict}» مستخدم في أمر آخر`,0);
      group.querySelector('.shortcut-aliases').innerHTML=names.length
        ? `<div class="shortcut-aliases-preview">${names.map(n=>scAlias({name:n})).join('')}</div>`
        : '<div class="shortcut-empty">لا توجد اختصارات — اضغط تعديل لإضافة اختصارات لهذا الأمر</div>';
      close();
      toast('تم تحديث الاختصارات في الصفحة، اضغط «حفظ الإعدادات» لتثبيتها نهائياً');
    };
    $('#sccancel').onclick=close;
    modal.onclick=e=>{if(e.target===modal)close()};
  }
  if($('#add')){$('#add').onclick=()=>$('.ar').insertAdjacentHTML('beforeend',arRow({}));$('#form').onclick=e=>{if(e.target.classList.contains('del'))e.target.closest('.ar-row').remove()}}
  if($('#add-question')){const list=$('.questions-list');const refresh=()=>{[...list.children].forEach((r,i)=>{r.querySelector('span').textContent=i+1;r.querySelector('input').placeholder=`اكتب السؤال رقم ${i+1}`});$('#add-question').disabled=list.children.length>=15};$('#add-question').onclick=()=>{if(list.children.length>=15)return;const i=list.children.length+1;list.insertAdjacentHTML('beforeend',`<div class="question-row"><span>${i}</span><input class="q" maxlength="100" placeholder="اكتب السؤال رقم ${i}"><button type="button" class="del-question" title="حذف السؤال">×</button></div>`);refresh()};list.onclick=e=>{if(e.target.closest('.del-question')){e.target.closest('.question-row').remove();refresh()}};refresh()}
}
function setupWelcomePreview(){
  const file=$('#welcome-upload'), bg=$('#welcome-preview-bg'), av=$('#welcome-preview-avatar'), name=$('#welcome-preview-name'), box=$('#welcome-preview');
  if(!file||!box)return;
  const savedPreview=data.image_preview||'';
  if(savedPreview) bg.src=savedPreview;
  else if(data.image_url&&/^https?:\/\//i.test(data.image_url))bg.src=data.image_url;
  if(data.avatar_url)av.src=data.avatar_url;
  else av.src='https://cdn.discordapp.com/embed/avatars/0.png';
  const scale=()=>{const w=box.clientWidth,h=box.clientHeight;av.style.left=(Number(data.avatar_x??100)/900*100)+'%';av.style.top=(Number(data.avatar_y??100)/350*100)+'%';av.style.width=(Number(data.avatar_size??135)/900*100)+'%';name.style.left=(Number(data.text_x??300)/900*100)+'%';name.style.top=(Number(data.text_y??150)/350*100)+'%';name.style.fontSize=`${Math.max(8,Number(data.text_size??40)/900*w)}px`;name.style.color=data.text_color||'#FFFFFF';};
  // Store positions in the same 900x350 coordinate space used by the bot canvas.
  const drag=(el,keyX,keyY)=>{let start=null;el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY,l:parseFloat(el.style.left)||0,t:parseFloat(el.style.top)||0};};el.onpointermove=e=>{if(!start)return;const r=box.getBoundingClientRect();const left=Math.max(0,Math.min(100,start.l+(e.clientX-start.x)/r.width*100));const top=Math.max(0,Math.min(100,start.t+(e.clientY-start.y)/r.height*100));el.style.left=left+'%';el.style.top=top+'%';data[keyX]=Math.round(left/100*900);data[keyY]=Math.round(top/100*350);const x=$(`[data-k="${keyX}"]`),y=$(`[data-k="${keyY}"]`);if(x)x.value=data[keyX];if(y)y.value=data[keyY];};el.onpointerup=()=>{start=null};};
  scale();drag(av,'avatar_x','avatar_y');drag(name,'text_x','text_y');
  file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast('اختر صورة PNG أو JPG أو WEBP',0);if(f.size>7*1024*1024)return toast('حجم الصورة يجب أن يكون أقل من 7MB',0);const reader=new FileReader();reader.onload=()=>{bg.src=reader.result;$('#welcome-image-data').value=reader.result;$('#welcome-preview-wrap').style.display='block';};reader.readAsDataURL(f)};
  window.addEventListener('resize',scale,{once:true});
}
async function save(){
  const o={};
  $$('#form [data-k]').forEach(e=>o[e.dataset.k]=e.type=='checkbox'?e.checked:e.value);
  if($('#form .q'))o.questions=$$('#form .q').map(e=>e.value);
  if($('#form .bw'))o.words=$$('#form .cw').map(x=>x.dataset.w);
  if($('#form .sc'))o.items=$$('#form .shortcut-command').flatMap(g=>[...g.querySelectorAll('.shortcut-chip')].map(ch=>({name:ch.dataset.name||ch.textContent.trim(),target:g.dataset.target,enabled:true}))).filter(x=>x.name&&x.target);
  if($('#form .ar'))o.items=$$('#form .ar-row').map(r=>({keyword:r.querySelector('.k').value,response:r.querySelector('.r').value,match_type:r.querySelector('.m').value,mention:r.querySelector('.c').checked}));
  if(cur==='welcome'){const uploaded=$('#welcome-image-data');if(uploaded&&uploaded.value)o.image_data=uploaded.value;['avatar_x','avatar_y','avatar_size','text_x','text_y','text_size','text_color'].forEach(k=>{const el=$(`[data-k="${k}"]`);if(el&&el.value!=='')o[k]=el.value;});}
  let body=o;
  if(F[cur].f[0][2]=='js'){try{body=JSON.parse(o.d);body.panel_channel_id=o.panel_channel_id}catch{return toast('صيغة JSON غير صحيحة',0)}}
  const b=$('#sv');b.disabled=true;
  try{
    const r=await api(`/api/guilds/${gid}/settings/${cur}?slot=${slot}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const p=r.panel;
    if(!p||p=='none')toast('تم حفظ الإعدادات');
    else if(p=='sent')toast(F[cur].ok||'تم الحفظ وإرسال البانل');
    else if(p=='unsupported')toast('تم الحفظ، وإرسال البانل لهذا القسم غير مفعّل بعد',0);
    else toast('تم الحفظ لكن فشل إرسال البانل: '+p.slice(6),0);
  }catch(e){
    let m=e.message;
    if(m.startsWith('REQ:')){const k=m.slice(4);m='الحقل مطلوب: '+((F[cur].f.find(x=>x[0]==k)||[])[1]||k)}
    toast(m,0);
  }
  b.disabled=false;
}
init();
</script>
